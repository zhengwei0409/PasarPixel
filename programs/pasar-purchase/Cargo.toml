[package]
name = "pasar-purchase"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pasar_purchase"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
mpl-core = "=0.11.1"

[dev-dependencies]
litesvm = "=0.6.1"
solana-sdk = "=2.2.1"
